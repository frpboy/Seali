name: Classic history UI qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-ui:
    if: false # Retained historical UI lane, pending current source-built native input and runtime-route qualification.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v3
      # Fail closed rather than changing host device permissions.
      - name: Check KVM availability
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::This qualification requires runner-provided readable/writable /dev/kvm. The workflow will not change host device permissions."
            exit 1
          fi
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew assembleGenericDebug assembleGenericDebugAndroidTest
            find app/build/outputs/apk/generic/debug -name '*x86_64*.apk' -print -quit | xargs adb install -r
            find app/build/outputs/apk/androidTest/generic/debug -name '*.apk' -print -quit | xargs adb install -r
            adb shell am instrument -w -r -e class com.frpboy.seali.ClassicHomeHistoryTest com.frpboy.seali.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-result.txt
            grep -F 'OK (2 tests)' instrumentation-result.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' instrumentation-result.txt
            adb exec-out run-as com.frpboy.seali.debug cat files/classic-history.png > classic-history.png
            test -s classic-history.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-history-ui-evidence
          path: |
            classic-history.png
            instrumentation-result.txt
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
