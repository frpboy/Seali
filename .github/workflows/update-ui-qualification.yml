name: Update page UI qualification
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source SHA (40 hex)
        required: true
        type: string
permissions:
  contents: read
jobs:
  update-ui:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bind reviewed source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v3
      # Fail closed rather than changing host device permissions.
      - name: Check KVM availability
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Requires runner-provided readable/writable /dev/kvm; host permissions are not changed."
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew assembleGenericDebug assembleGenericDebugAndroidTest
            find app/build/outputs/apk/generic/debug -name '*x86_64*.apk' -print -quit | xargs adb install -r
            find app/build/outputs/apk/androidTest/generic/debug -name '*.apk' -print -quit | xargs adb install -r
            adb shell am instrument -w -r -e class com.frpboy.seali.UpdateProgressPageTest com.frpboy.seali.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-result.txt
            grep -F 'OK (1 test)' instrumentation-result.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' instrumentation-result.txt
            for s in available downloading verifying confirm refused; do adb exec-out run-as com.frpboy.seali.debug cat files/update-$s.png > update-$s.png; test -s update-$s.png; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-page-ui-evidence
          path: |
            update-*.png
            instrumentation-result.txt
            app/build/reports/androidTests/connected/
          retention-days: 3
