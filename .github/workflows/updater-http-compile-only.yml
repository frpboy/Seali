name: Updater candidate source compile only
on:
  push:
    branches:
      - qualification/updater-http-compile-20261124-1854aa51
permissions:
  contents: read
concurrency:
  group: updater-source-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind repository, push ref, source manifest and wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = frpboy/Seali
          test "$GITHUB_REF" = refs/heads/qualification/updater-http-compile-20261124-1854aa51
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          python3 - <<'PYVERIFY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          manifest=root/'scripts/ci/updater-http-source-manifest.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest()=='c7de7fa55c1c669eafb5c0df8cd9bbf60f104684caed523dcd9d3a27372d3a7c'
          d=json.loads(manifest.read_text())
          tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().rstrip('\0').split('\0'))
          expected={r['path'] for r in d['files']}
          assert tracked-set(d['excluded'])==expected, 'tracked file set differs'
          for row in d['files']:
              f=root/row['path']
              assert f.is_file() and not f.is_symlink(), row['path']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==row['sha256'], row['path']
          assert hashlib.sha256((root/'gradle/wrapper/gradle-wrapper.jar').read_bytes()).hexdigest()=='e996d452d2645e70c01c11143ca2d3742734a28da2bf61f25c82bdc288c9e637'
          assert 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' in (root/'gradle/wrapper/gradle-wrapper.properties').read_text()
          print('source manifest and wrapper verified')
          PYVERIFY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Inspect exact compile task plan
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew :app:compileGenericDebugKotlin --no-daemon --no-configuration-cache --max-workers=2 --console=plain --dry-run | tee "$RUNNER_TEMP/updater-task-plan.log"
          python3 - "$RUNNER_TEMP/updater-task-plan.log" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          tasks=re.findall(r'^(:\S+) SKIPPED$',text,re.M)
          assert ':app:compileGenericDebugKotlin' in tasks, 'compile task missing'
          forbidden=re.compile(r'native|jnilib|externalnative|cmake|ndk|assemble|sign|publish|upload|release|install|connected|test',re.I)
          assert not [t for t in tasks if forbidden.search(t) or ('bundle' in t.lower() and 'bundleLibCompileToJar' not in t)], 'unexpected effect in task plan'
          PY
      - name: Compile actual candidate app, no packaging or tests
        run: bash gradlew :app:compileGenericDebugKotlin --no-daemon --no-configuration-cache --max-workers=2 --console=plain -Dorg.gradle.jvmargs=-Xmx4096m -Pkotlin.compiler.execution.strategy=in-process
      # No secrets, producer workflow, native build/staging, Maven publication,
      # APK/AAB, signing, install, upload-artifact, release, tag or deployment.
