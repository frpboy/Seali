name: Disposable updater component qualification
on:
  push:
    branches: [qualification/updater-component-20261124-host1]
permissions:
  contents: read
concurrency:
  group: updater-component-qualification-20261124
  cancel-in-progress: false
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - api: 26
            target: default
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind reviewed host and source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = frpboy/Seali
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/qualification/updater-component-20261124-host1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'eca38f6fcdcd0a0da68ef724fcc95ddaf520947cedad257048bae8ed05125b0b  qualification/updater-component/verify.py' | sha256sum -c -
          python3 qualification/updater-component/verify.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install only Java Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable hosted KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: qualification/updater-component
          script: bash run-component.sh
